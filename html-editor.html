<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Html Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #060b09;
            --bg2: #0a1410;
            --card: rgba(255, 255, 255, .05);
            --border: rgba(255, 255, 255, .07);
            --text: #05ff82;
            --text2: #a0c0b4;
            --primary: #00b894;
            --primary-dim: rgba(0, 184, 148, .15);
            --primary-glow: rgba(0, 184, 148, .40);
            --secondary: #00d2d3;
            --shadow: 0 0 60px rgba(0, 184, 148, .30);
            --radius: 16px;
            --transition: .40s cubic-bezier(.22, 1, .36, 1);
            --header-height: 60px;
            --editor-height: calc(100vh - var(--header-height) - 50px);
            --search-highlight: rgba(254, 202, 87, .35);
            --search-highlight-current: rgba(254, 202, 87, .65);
        }
        *:focus {
            outline: none;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            line-height: 1.6;
            padding-top: var(--header-height);
            position: relative;
        }
        ::selection {
            background: var(--primary);
            color: #0a1410;
        }
        #background {
            position: fixed;
            inset: 0;
            z-index: -10;
            background:
                radial-gradient(ellipse at 20% 15%, rgba(0, 184, 148, .20), transparent 45%),
                radial-gradient(ellipse at 85% 85%, rgba(0, 210, 211, .12), transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 184, 148, .04), transparent 70%),
                linear-gradient(160deg, #040a07, #0a1812);
        }
        #background .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 184, 148, .35);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            filter: blur(1px);
        }
        @keyframes floatParticle {
            0% {
                transform: translateY(0) scale(1);
                opacity: .3;
            }
            50% {
                opacity: .8;
            }
            100% {
                transform: translateY(-110vh) scale(0);
                opacity: 0;
            }
        }
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 12px;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            backdrop-filter: blur(24px) saturate(1.4);
            background: rgba(6, 11, 9, .55);
            border-bottom: 1px solid rgba(0, 184, 148, .10);
            z-index: 1000;
            transition: background .4s;
        }
        header.scrolled {
            background: rgba(6, 11, 9, .85);
            border-bottom-color: rgba(0, 184, 148, .18);
        }
        .logo {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -.3px;
            white-space: nowrap;
        }
        .logo .highlight {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            transition: var(--transition);
            text-decoration: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #00856a);
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 184, 148, .25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 184, 148, .40);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, .08);
            color: var(--text2);
            border: 1px solid rgba(255, 255, 255, .06);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, .14);
            color: #fff;
        }
        .btn-fullscreen {
            background: rgba(0, 184, 148, .15);
            color: var(--primary);
            border: 1px solid rgba(0, 184, 148, .2);
            font-size: 16px;
            padding: 8px 14px;
        }
        .btn-fullscreen:hover {
            background: rgba(0, 184, 148, .25);
            transform: scale(1.05);
        }
        .btn-save {
            background: rgba(255, 215, 0, .15);
            color: #feca57;
            border: 1px solid rgba(255, 215, 0, .2);
            font-size: 13px;
        }
        .btn-save:hover {
            background: rgba(255, 215, 0, .25);
            transform: scale(1.05);
        }
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            height: var(--editor-height);
            padding: 12px 16px 16px;
            max-width: 100vw;
            transition: all 0.3s ease;
        }
        .editor-panel {
            background: rgba(0, 0, 0, .4);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(8px);
            position: relative;
        }
        .editor-panel .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, .3);
            flex-shrink: 0;
            min-height: 44px;
        }
        .panel-header .panel-title {
            font-size: 12px;
            color: var(--text2);
            font-weight: 500;
        }
        .panel-header .lang-badge {
            font-size: 11px;
            color: var(--primary);
            background: var(--primary-dim);
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
        .panel-header .save-status {
            font-size: 11px;
            color: var(--text2);
            opacity: .5;
            margin-left: auto;
        }
        .editor-wrapper {
            flex: 1;
            position: relative;
            overflow: auto;
        }
        .editor-wrapper textarea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: #c8e6d9;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.8;
            padding: 16px 20px;
            resize: none;
            outline: none;
            tab-size: 4;
            z-index: 2;
            caret-color: var(--primary);
        }
        .editor-wrapper textarea::placeholder {
            color: rgba(160, 192, 180, .25);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .syntax-highlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 16px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.8;
            color: transparent;
            white-space: pre-wrap;
            word-wrap: break-word;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .syntax-highlight .tag { color: #f92672; }
        .syntax-highlight .attr { color: #a6e22e; }
        .syntax-highlight .value { color: #e6db74; }
        .syntax-highlight .string { color: #e6db74; }
        .syntax-highlight .comment { color: #75715e; font-style: italic; }
        .syntax-highlight .keyword { color: #f92672; }
        .syntax-highlight .function { color: #a6e22e; }
        .syntax-highlight .number { color: #ae81ff; }
        .syntax-highlight .operator { color: #f92672; }
        .syntax-highlight .variable { color: #66d9ef; }
        .syntax-highlight .property { color: #66d9ef; }
        .syntax-highlight .selector { color: #f92672; }
        .syntax-highlight .pseudo { color: #66d9ef; }
        .syntax-highlight .important { color: #ff6b6b; font-weight: bold; }
        .syntax-highlight .search-match { background: var(--search-highlight); color: #c8e6d9; }
        .syntax-highlight .search-match-current { background: var(--search-highlight-current); color: #c8e6d9; border-bottom: 2px solid var(--warning-color); }

        .preview-panel {
            background: rgba(255, 255, 255, .02);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(8px);
        }
        .preview-panel .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, .3);
            flex-shrink: 0;
            min-height: 44px;
        }
        .preview-frame {
            flex: 1;
            background: #fff;
            border: none;
            width: 100%;
            height: 100%;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 20px;
            border-top: 1px solid rgba(255, 255, 255, .04);
            background: rgba(0, 0, 0, .3);
            font-size: 12px;
            color: var(--text2);
            height: 36px;
            flex-shrink: 0;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-bar .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .status-bar .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--primary);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .3; }
        }
        .shortcuts {
            display: flex;
            gap: 12px;
            color: rgba(160, 192, 180, .4);
            font-size: 11px;
            flex-wrap: wrap;
        }
        .shortcuts kbd {
            background: rgba(255, 255, 255, .06);
            padding: 1px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text2);
        }

        /* Search overlay */
        .search-overlay {
            position: absolute;
            top: 50px;
            right: 16px;
            background: rgba(6, 11, 9, .95);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 100;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,.6);
        }
        .search-overlay.active {
            display: flex;
        }
        .search-overlay input {
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 10px;
            color: #c8e6d9;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            width: 180px;
            outline: none;
        }
        .search-overlay input:focus {
            border-color: var(--primary);
        }
        .search-overlay .search-info {
            font-size: 12px;
            color: var(--text2);
            white-space: nowrap;
        }
        .search-overlay .search-close {
            background: none;
            border: none;
            color: var(--text2);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        .search-overlay .search-close:hover {
            color: #fff;
        }

        /* ===== FULLSCREEN - ТОЛЬКО ПРЕВЬЮ ===== */
        .fullscreen-mode {
            padding-top: 0 !important;
        }
        .fullscreen-mode header {
            display: none !important;
        }
        .fullscreen-mode .status-bar {
            display: none !important;
        }
        .fullscreen-mode #background {
            display: none !important;
        }
        .fullscreen-mode .editor-container {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99999 !important;
            padding: 0 !important;
            gap: 0 !important;
            background: var(--bg) !important;
            margin: 0 !important;
            border-radius: 0 !important;
            max-width: 100vw !important;
            display: block !important;
        }
        .fullscreen-mode .editor-container .editor-panel {
            display: none !important;
        }
        .fullscreen-mode .editor-container .preview-panel {
            border-radius: 0 !important;
            height: 100vh !important;
            width: 100vw !important;
        }
        .fullscreen-mode .editor-container .preview-panel .panel-header {
            display: none !important;
        }
        .fullscreen-mode .editor-container .preview-panel .preview-frame {
            height: 100vh !important;
            width: 100vw !important;
        }

        /* Всплывающая подсказка для выхода из fullscreen */
        .fullscreen-hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .85);
            color: var(--text2);
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 999999;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, .1);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            font-family: 'Inter', sans-serif;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .fullscreen-hint.show {
            opacity: 1;
        }
        .fullscreen-hint kbd {
            background: rgba(255, 255, 255, .1);
            padding: 2px 10px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
            margin: 0 4px;
        }
        .fullscreen-hint .progress-ring {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .1);
            position: relative;
            flex-shrink: 0;
        }
        .fullscreen-hint .progress-ring .fill {
            position: absolute;
            top: -3px;
            left: -3px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            clip-path: inset(0 50% 0 0);
            transform: rotate(0deg);
            transition: none;
        }
        .fullscreen-hint .progress-ring .fill.active {
            animation: fillProgress 0.8s linear forwards;
        }
        @keyframes fillProgress {
            0% { clip-path: inset(0 50% 0 0); transform: rotate(0deg); }
            100% { clip-path: inset(0 0 0 0); transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            .editor-container {
                grid-template-columns: 1fr;
                padding: 8px 10px 10px;
                height: calc(100vh - var(--header-height) - 60px);
            }
            .editor-panel {
                height: 45vh;
            }
            .preview-panel {
                height: 45vh;
            }
            .header-actions .btn span {
                display: none;
            }
            header {
                padding: 0 12px;
            }
            .logo {
                font-size: 15px;
            }
            .btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .shortcuts {
                display: none;
            }
            .search-overlay input {
                width: 120px;
                font-size: 12px;
            }
            .fullscreen-mode .editor-container .preview-panel {
                height: 100vh !important;
                width: 100vw !important;
            }
            .fullscreen-mode .editor-container .preview-panel .preview-frame {
                height: 100vh !important;
                width: 100vw !important;
            }
            .fullscreen-hint {
                font-size: 12px;
                padding: 8px 16px;
                bottom: 20px;
                max-width: 90%;
            }
            .fullscreen-hint .progress-ring {
                width: 24px;
                height: 24px;
            }
            .fullscreen-hint .progress-ring .fill {
                width: 24px;
                height: 24px;
            }
        }
        @media (max-width: 500px) {
            .logo {
                font-size: 13px;
            }
            .btn {
                padding: 5px 10px;
                font-size: 11px;
            }
            .btn-fullscreen {
                font-size: 14px;
                padding: 5px 10px;
            }
            .editor-wrapper textarea {
                font-size: 12px;
                padding: 10px 14px;
            }
            .syntax-highlight {
                font-size: 12px;
                padding: 10px 14px;
            }
            .panel-header .panel-title {
                font-size: 10px;
            }
            .search-overlay input {
                width: 100px;
                font-size: 11px;
            }
            .search-overlay {
                right: 8px;
                padding: 6px 10px;
            }
            .fullscreen-mode .editor-container .preview-panel {
                height: 100vh !important;
                width: 100vw !important;
            }
            .fullscreen-mode .editor-container .preview-panel .preview-frame {
                height: 100vh !important;
                width: 100vw !important;
            }
            .fullscreen-hint {
                font-size: 10px;
                padding: 6px 12px;
                bottom: 15px;
                max-width: 95%;
            }
            .fullscreen-hint .progress-ring {
                width: 20px;
                height: 20px;
            }
            .fullscreen-hint .progress-ring .fill {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="background"></div>

    <!-- full screen exit -->
    <div class="fullscreen-hint" id="fullscreenHint">
        <span>Hold <kbd>Q</kbd> or <kbd>Й</kbd> for exit</span>
        <div class="progress-ring">
            <div class="fill" id="progressFill"></div>
        </div>
    </div>

    <header id="header">
        <div class="logo">◈ <span class="highlight">Html</span> Editor</div>
        <div class="header-actions">
            <button class="btn btn-secondary" id="resetBtn">↺ Reset</button>
            <button class="btn btn-save" id="saveBtn">Save</button>
            <button class="btn btn-primary" id="runBtn">▶ Start</button>
            <button class="btn btn-fullscreen" id="fullscreenBtn" title="Полный экран">⛶</button>
        </div>
    </header>

    <div class="editor-container" id="editorContainer">
        <!-- Editor Panel -->
        <div class="editor-panel" id="editorPanel">
            <div class="panel-header">
                <span class="panel-title">Editor</span>
                <span class="lang-badge">HTML</span>
                <span class="save-status" id="saveStatus">Auto Save</span>
                <span style="margin-left: auto; font-size: 11px; color: var(--text2); opacity:.4;">Ctrl+F Search</span>
            </div>
            <div class="editor-wrapper">
                <div class="syntax-highlight" id="syntaxHighlight"></div>
                <textarea id="codeEditor" spellcheck="false" placeholder="Start write html code..."></textarea>
                <!-- Search overlay -->
                <div class="search-overlay" id="searchOverlay">
                    <input type="text" id="searchInput" placeholder="Search..." />
                    <span class="search-info" id="searchInfo">0/0</span>
                    <button class="search-close" id="searchClose">✕</button>
                </div>
            </div>
        </div>

        <!-- Preview Panel -->
        <div class="preview-panel">
            <div class="panel-header">
                <span class="panel-title">Result</span>
                <span style="margin-left: auto; font-size: 11px; color: var(--text2); opacity:.4;">live</span>
            </div>
            <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-dot"></span>
            <span>Editor</span>
        </div>
        <div class="shortcuts">
            <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> start</span>
            <span><kbd>Ctrl</kbd>+<kbd>S</kbd> save</span>
            <span><kbd>Ctrl</kbd>+<kbd>F</kbd> search</span>
        </div>
        <div class="status-item">
            <span id="charCount">0</span> characters
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // Particles
            const bg = document.getElementById('background');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('span');
                p.className = 'particle';
                const size = 2 + Math.random() * 4;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = (Math.random() * 100 + 20) + '%';
                p.style.animationDuration = (14 + Math.random() * 22) + 's';
                p.style.animationDelay = (Math.random() * 8) + 's';
                p.style.opacity = 0.2 + Math.random() * 0.4;
                bg.appendChild(p);
            }

            const codeEditor = document.getElementById('codeEditor');
            const syntaxHighlight = document.getElementById('syntaxHighlight');
            const previewFrame = document.getElementById('previewFrame');
            const runBtn = document.getElementById('runBtn');
            const resetBtn = document.getElementById('resetBtn');
            const saveBtn = document.getElementById('saveBtn');
            const saveStatus = document.getElementById('saveStatus');
            const charCount = document.getElementById('charCount');
            const editorContainer = document.getElementById('editorContainer');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const searchOverlay = document.getElementById('searchOverlay');
            const searchInput = document.getElementById('searchInput');
            const searchInfo = document.getElementById('searchInfo');
            const searchClose = document.getElementById('searchClose');
            const header = document.getElementById('header');
            const previewFrameEl = document.getElementById('previewFrame');
            const fullscreenHint = document.getElementById('fullscreenHint');
            const progressFill = document.getElementById('progressFill');

            const STORAGE_KEY = 'code_editor_content';

            function saveToStorage() {
                const content = codeEditor.value;
                try {
                    localStorage.setItem(STORAGE_KEY, content);
                    saveStatus.textContent = 'Saved';
                    saveStatus.style.color = 'var(--primary)';
                    setTimeout(() => {
                        saveStatus.textContent = 'Auto Save';
                        saveStatus.style.color = '';
                    }, 1500);
                } catch (e) {
                    console.warn('Не удалось сохранить:', e);
                }
            }

            function loadFromStorage() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved !== null) {
                        codeEditor.value = saved;
                        return true;
                    }
                } catch (e) {
                    console.warn('Не удалось загрузить:', e);
                }
                return false;
            }

            let isFullscreen = false;
            let holdTimer = null;
            let isHolding = false;
            let holdStartTime = 0;
            let progressAnimFrame = null;

            function toggleFullscreen() {
                if (!isFullscreen) {
                    document.body.classList.add('fullscreen-mode');
                    isFullscreen = true;
                    fullscreenBtn.textContent = '⛶';
                    fullscreenBtn.title = 'To exit fullscreen (Hold Q Or Й)';
                    // Показываем подсказку
                    fullscreenHint.classList.add('show');
                    // Сбрасываем прогресс
                    progressFill.className = 'fill';
                    setTimeout(() => {
                        if (isFullscreen) {
                            fullscreenHint.classList.remove('show');
                        }
                    }, 5000);
                    setTimeout(() => {
                        previewFrameEl.style.height = window.innerHeight + 'px';
                        previewFrameEl.style.width = window.innerWidth + 'px';
                    }, 10);
                } else {
                    document.body.classList.remove('fullscreen-mode');
                    isFullscreen = false;
                    fullscreenBtn.textContent = '⛶';
                    fullscreenBtn.title = 'Fullscreen';
                    fullscreenHint.classList.remove('show');
                    progressFill.className = 'fill';
                    if (progressAnimFrame) {
                        cancelAnimationFrame(progressAnimFrame);
                        progressAnimFrame = null;
                    }
                    setTimeout(() => {
                        previewFrameEl.style.height = '';
                        previewFrameEl.style.width = '';
                        updatePreview();
                    }, 50);
                }
            }

            function startHold() {
                if (!isFullscreen || isHolding) return;
                isHolding = true;
                holdStartTime = Date.now();
                fullscreenHint.classList.add('show');
                progressFill.className = 'fill';

                function updateProgress() {
                    if (!isHolding || !isFullscreen) {
                        progressFill.className = 'fill';
                        return;
                    }
                    const elapsed = Date.now() - holdStartTime;
                    const progress = Math.min(elapsed / 800, 1);
                    const degrees = progress * 360;
                    if (progress >= 1) {
                        // Выходим из fullscreen
                        toggleFullscreen();
                        fullscreenHint.textContent = 'Exit';
                        setTimeout(() => {
                            fullscreenHint.textContent = 'Hold Q or Й for exit';
                            fullscreenHint.classList.remove('show');
                        }, 1500);
                        isHolding = false;
                        progressFill.className = 'fill';
                        return;
                    }
                    progressFill.style.clipPath = `inset(0 ${50 - (progress * 50)}% 0 0)`;
                    progressFill.style.transform = `rotate(${degrees}deg)`;
                    progressAnimFrame = requestAnimationFrame(updateProgress);
                }
                progressAnimFrame = requestAnimationFrame(updateProgress);
            }

            function cancelHold() {
                if (progressAnimFrame) {
                    cancelAnimationFrame(progressAnimFrame);
                    progressAnimFrame = null;
                }
                isHolding = false;
                progressFill.className = 'fill';

            }

            document.addEventListener('keydown', function(e) {
                const key = e.key;

                if ((key === 'q' || key === 'Q' || key === 'й' || key === 'Й') && isFullscreen) {
                    e.preventDefault();
                    startHold();
                }

                if (e.key === 'Escape' && isFullscreen) {
                    e.preventDefault();
                    if (searchOverlay.classList.contains('active')) {
                        searchOverlay.classList.remove('active');
                        searchQuery = '';
                        searchInput.value = '';
                        searchMatches = [];
                        currentMatchIndex = -1;
                        updateSearchInfo();
                        updateSyntaxWithSearch();
                        return;
                    }
                    cancelHold();
                    toggleFullscreen();
                    fullscreenHint.textContent = 'Exit';
                    fullscreenHint.classList.add('show');
                    setTimeout(() => {
                        fullscreenHint.textContent = 'Hold Q or Й for exit';
                        fullscreenHint.classList.remove('show');
                    }, 1500);
                }
            });

            document.addEventListener('keyup', function(e) {
                const key = e.key;
                if (key === 'q' || key === 'Q' || key === 'й' || key === 'Й') {
                    if (isHolding) {
                        cancelHold();
                    }
                }
            });

            fullscreenBtn.addEventListener('click', toggleFullscreen);
            window.addEventListener('resize', () => {
                if (isFullscreen) {
                    previewFrameEl.style.height = window.innerHeight + 'px';
                    previewFrameEl.style.width = window.innerWidth + 'px';
                }
            });

            function escapeHtml(text) {
                return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function highlightSyntax(code) {
                if (!code.trim()) return '';

                let highlighted = escapeHtml(code);

                // Comments
                highlighted = highlighted.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="comment">$1</span>');

                // DOCTYPE
                highlighted = highlighted.replace(/(&lt;!DOCTYPE[^&gt;]*&gt;)/gi, '<span class="keyword">$1</span>');

                // Tags with attributes
                highlighted = highlighted.replace(/(&lt;\/?)([\w-]+)([^&gt;]*&gt;)/g, (match, open, tag, rest) => {
                    let attrs = rest.replace(/(\s+)([\w-]+)(\s*=\s*)(["'])(.*?)\4/g,
                        (m, space, attr, eq, quote, val) => {
                            return `${space}<span class="attr">${attr}</span>${eq}<span class="value">${quote}${val}${quote}</span>`;
                        });
                    attrs = attrs.replace(/\s+([\w-]+)(?=\s|&gt;)/g, (m, attr) => {
                        return ` <span class="attr">${attr}</span>`;
                    });
                    return `${open}<span class="tag">${tag}</span>${attrs}`;
                });

                return highlighted;
            }

            // ============ SEARCH ============
            let searchQuery = '';
            let searchMatches = [];
            let currentMatchIndex = -1;

            function updateSyntaxWithSearch() {
                const code = codeEditor.value;
                let highlighted = highlightSyntax(code);

                if (searchQuery) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = highlighted;
                    const plainText = tempDiv.textContent || tempDiv.innerText || '';

                    const escaped = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escaped, 'gi');
                    const matches = [];
                    let match;
                    while ((match = regex.exec(plainText)) !== null) {
                        matches.push({ index: match.index, length: match[0].length });
                    }

                    searchMatches = matches;

                    if (matches.length > 0) {
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = highlighted;

                        function walkNodes(node) {
                            if (node.nodeType === 3) {
                                const text = node.textContent;
                                const parent = node.parentNode;
                                const escaped = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                                const regex = new RegExp(escaped, 'gi');
                                let match;
                                let lastIdx = 0;
                                let fragments = [];
                                let matchCounter = 0;

                                while ((match = regex.exec(text)) !== null) {
                                    const before = text.substring(lastIdx, match.index);
                                    const matched = text.substring(match.index, match.index + match[0].length);
                                    const isCurrent = (matchCounter === currentMatchIndex);
                                    const className = isCurrent ? 'search-match-current' : 'search-match';

                                    fragments.push(before);
                                    fragments.push(`<span class="${className}">${matched}</span>`);
                                    lastIdx = match.index + match[0].length;
                                    matchCounter++;
                                }
                                fragments.push(text.substring(lastIdx));

                                if (fragments.length > 1) {
                                    const newHtml = fragments.join('');
                                    const temp = document.createElement('span');
                                    temp.innerHTML = newHtml;
                                    while (temp.firstChild) {
                                        parent.insertBefore(temp.firstChild, node);
                                    }
                                    parent.removeChild(node);
                                }
                            } else if (node.nodeType === 1) {
                                const children = Array.from(node.childNodes);
                                for (const child of children) {
                                    walkNodes(child);
                                }
                            }
                        }

                        const clone = wrapper.cloneNode(true);
                        walkNodes(clone);
                        highlighted = clone.innerHTML;
                    }
                }

                syntaxHighlight.innerHTML = highlighted + '\n';
            }

            function updateSearchInfo() {
                if (searchQuery) {
                    const total = searchMatches.length;
                    const current = total > 0 ? currentMatchIndex + 1 : 0;
                    searchInfo.textContent = `${current}/${total}`;
                } else {
                    searchInfo.textContent = '0/0';
                }
            }

            function performSearch() {
                searchQuery = searchInput.value;
                currentMatchIndex = -1;

                if (!searchQuery) {
                    searchMatches = [];
                    updateSearchInfo();
                    updateSyntaxWithSearch();
                    return;
                }

                const text = codeEditor.value;
                const escaped = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escaped, 'gi');
                const matches = [];
                let match;
                while ((match = regex.exec(text)) !== null) {
                    matches.push({ index: match.index, length: match[0].length });
                }
                searchMatches = matches;
                currentMatchIndex = matches.length > 0 ? 0 : -1;

                updateSearchInfo();
                updateSyntaxWithSearch();

                if (matches.length > 0) {
                    scrollToMatch(0);
                }
            }

            function scrollToMatch(index) {
                if (index < 0 || index >= searchMatches.length) return;
                const match = searchMatches[index];
                const text = codeEditor.value;
                const lineHeight = parseInt(getComputedStyle(codeEditor).lineHeight);
                const textBefore = text.substring(0, match.index);
                const lines = textBefore.split('\n');
                const lineIndex = lines.length - 1;
                const scrollPos = lineIndex * lineHeight;
                codeEditor.scrollTop = Math.max(0, scrollPos - 50);
            }

            function nextMatch() {
                if (searchMatches.length === 0) return;
                currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
                updateSearchInfo();
                updateSyntaxWithSearch();
                scrollToMatch(currentMatchIndex);
            }

            // ============ PREVIEW ============
            function updatePreview() {
                const code = codeEditor.value || ' ';
                const blob = new Blob([code], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                previewFrame.src = url;
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                const length = codeEditor.value.length;
                charCount.textContent = length;
                updateSyntaxWithSearch();
                saveToStorage();
            }

            // ============ EVENTS ============
            resetBtn.addEventListener('click', () => {
                if (confirm('Очистить редактор?')) {
                    codeEditor.value = '';
                    searchQuery = '';
                    searchInput.value = '';
                    searchMatches = [];
                    currentMatchIndex = -1;
                    updateSearchInfo();
                    updatePreview();
                    localStorage.removeItem(STORAGE_KEY);
                    saveStatus.textContent = 'Cleared';
                    saveStatus.style.color = '#ff6b6b';
                    setTimeout(() => {
                        saveStatus.textContent = 'Auto Save';
                        saveStatus.style.color = '';
                    }, 1500);
                }
            });

            saveBtn.addEventListener('click', () => {
                saveToStorage();
                saveStatus.textContent = 'Saved!';
                saveStatus.style.color = 'var(--primary)';
                setTimeout(() => {
                    saveStatus.textContent = 'Auto Save';
                    saveStatus.style.color = '';
                }, 1500);
            });

            runBtn.addEventListener('click', updatePreview);

            let debounceTimer;
            codeEditor.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    updatePreview();
                }, 500);
                const length = codeEditor.value.length;
                charCount.textContent = length;

                if (searchOverlay.classList.contains('active') && searchInput.value) {
                    performSearch();
                }
            });

            codeEditor.addEventListener('scroll', function() {
                syntaxHighlight.scrollTop = this.scrollTop;
                syntaxHighlight.scrollLeft = this.scrollLeft;
            });

            // Глобальные горячие клавиши
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    saveToStorage();
                    saveStatus.textContent = 'Saved!';
                    saveStatus.style.color = 'var(--primary)';
                    setTimeout(() => {
                        saveStatus.textContent = 'Auto Save';
                        saveStatus.style.color = '';
                    }, 1500);
                }
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    updatePreview();
                }
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    searchOverlay.classList.toggle('active');
                    if (searchOverlay.classList.contains('active')) {
                        searchInput.focus();
                        searchInput.select();
                        performSearch();
                    } else {
                        searchQuery = '';
                        searchInput.value = '';
                        searchMatches = [];
                        currentMatchIndex = -1;
                        updateSearchInfo();
                        updateSyntaxWithSearch();
                    }
                }
                if (e.key === 'F3' && searchOverlay.classList.contains('active')) {
                    e.preventDefault();
                    nextMatch();
                }
            });

            searchInput.addEventListener('input', performSearch);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    nextMatch();
                }
                if (e.key === 'Escape') {
                    searchOverlay.classList.remove('active');
                    codeEditor.focus();
                    searchQuery = '';
                    searchInput.value = '';
                    searchMatches = [];
                    currentMatchIndex = -1;
                    updateSearchInfo();
                    updateSyntaxWithSearch();
                    e.preventDefault();
                }
            });
            searchClose.addEventListener('click', () => {
                searchOverlay.classList.remove('active');
                codeEditor.focus();
                searchQuery = '';
                searchInput.value = '';
                searchMatches = [];
                currentMatchIndex = -1;
                updateSearchInfo();
                updateSyntaxWithSearch();
            });

            document.addEventListener('click', (e) => {
                if (searchOverlay.classList.contains('active') &&
                    !searchOverlay.contains(e.target) &&
                    e.target !== codeEditor) {
                    searchOverlay.classList.remove('active');
                    searchQuery = '';
                    searchInput.value = '';
                    searchMatches = [];
                    currentMatchIndex = -1;
                    updateSearchInfo();
                    updateSyntaxWithSearch();
                }
            });

            codeEditor.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    if (this.value.substring(start, end).includes('\n')) {
                        const lines = this.value.split('\n');
                        const startLine = this.value.substring(0, start).split('\n').length - 1;
                        const endLine = this.value.substring(0, end).split('\n').length - 1;
                        for (let i = startLine; i <= endLine; i++) {
                            if (e.shiftKey) {
                                lines[i] = lines[i].replace(/^ {4}/, '');
                            } else {
                                lines[i] = '    ' + lines[i];
                            }
                        }
                        this.value = lines.join('\n');
                        this.selectionStart = start + (e.shiftKey ? -4 : 4);
                        this.selectionEnd = end + (e.shiftKey ? -4 : 4);
                    } else {
                        this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                        this.selectionStart = this.selectionEnd = start + 4;
                    }
                    updateSyntaxWithSearch();
                    charCount.textContent = this.value.length;
                }
            });

            window.addEventListener('scroll', () => {
                header.classList.toggle('scrolled', window.scrollY > 40);
            });

            // ============ INIT ============
            const hasSaved = loadFromStorage();
            if (!hasSaved) {
                codeEditor.value = '';
            }
            charCount.textContent = codeEditor.value.length;
            updatePreview();
        })();
    </script>
</body>
</html>
